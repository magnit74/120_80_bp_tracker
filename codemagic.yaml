workflows:
  ios-expo-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Globalkey
    environment:
      groups:
        - ios_credentials
      vars:
        EXPLICIT_MODULE_BUILD_INCLUDES: "NO"
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Generate Native iOS code (Expo Prebuild)
        script: npx expo prebuild --platform ios --clean
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch App Store signing files
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          export APP_STORE_CONNECT_API_KEY_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID
          export APP_STORE_CONNECT_API_KEY_KEY_ID=$APP_STORE_CONNECT_KEY_IDENTIFIER
          export APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=/tmp/AuthKey.p8
          fastlane produce group -g "group.com.magnit74.bptracker" -n "12080BPTracker Group" || true
          fastlane produce associate_group -a "com.magnit74.bptracker" "group.com.magnit74.bptracker" || true
          fastlane produce associate_group -a "com.magnit74.bptracker.ExpoWidgetsTarget" "group.com.magnit74.bptracker" || true
          app-store-connect fetch-signing-files "com.magnit74.bptracker" --type IOS_APP_STORE --create --delete-stale-profiles
          app-store-connect fetch-signing-files "com.magnit74.bptracker.ExpoWidgetsTarget" --type IOS_APP_STORE --create --delete-stale-profiles
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up iOS code signing
        script: xcode-project use-profiles --project "ios/12080BPTracker.xcodeproj"
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/12080BPTracker.xcworkspace \
            --scheme 12080BPTracker
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
