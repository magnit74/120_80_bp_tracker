workflows:
  ios-expo-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: GlobalKey
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Generate Native iOS code (Expo Prebuild)
        script: npx expo prebuild --platform ios --clean
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          # Codemagic автоматически найдет xcworkspace и scheme
          xcode-project build-ipa \
            --workspace $(find ios -name "*.xcworkspace" | head -n 1) \
            --scheme "bptracker"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false # Поставьте true, когда будете готовы автоматически отправлять в TestFlight
        submit_to_app_store: false
