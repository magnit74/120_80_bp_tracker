workflows:
  ios-expo-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Globalkey
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Generate Native iOS code (Expo Prebuild)
        script: npx expo prebuild --platform ios --clean
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch App Store signing files
        script: app-store-connect fetch-signing-files "com.magnit74.bptracker" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up iOS code signing
        script: xcode-project use-profiles --project "ios/12080BPTracker.xcodeproj"
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/12080BPTracker.xcworkspace \
            --scheme 12080BPTracker
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false # Поставьте true, когда будете готовы автоматически отправлять в TestFlight
        submit_to_app_store: false
