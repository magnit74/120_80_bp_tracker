<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Screens Overview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #E5E7EB; }
        .device-frame {
            width: 400px;
            height: 850px;
            border-radius: 40px;
            overflow: hidden;
            border: 14px solid #1f2937;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            background: white;
            flex-shrink: 0;
            position: relative;
        }
        .device-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background-color: #1f2937;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 50;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="p-8">
    <div class="mb-12 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4">120/80 BP Tracker - UI Overview</h1>
        <p class="text-lg text-gray-600">Все экраны для финальной проверки дизайна</p>
    </div>

    <div class="flex flex-wrap justify-center gap-12 max-w-[1400px] mx-auto">
        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">1. Offer Preland</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="OfferPreland.html"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">2. Onboarding 1</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="Onboarding1.html"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">3. Onboarding 2</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="Onboarding2.html"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">4. Onboarding 3</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="Onboarding3.html"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">5. Push Permission</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="PushPermission.html"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">6. Home Dashboard</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="HomeDashboard.html"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">7. Add Measurement</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="AddMeasurement.html"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">8. Analytics</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="Analytics.html"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-gray-700">9. PDF Export</h2>
            <div class="device-frame">
                <div class="device-notch"></div>
                <iframe src="PdfExport.html"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
