<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay on Track</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; }
        .app-container { max-width: 400px; margin: 0 auto; background: radial-gradient(circle at top, #ffffff 0%, #F4F7FA 100%); min-height: 100vh; position: relative; padding-bottom: 0; box-shadow: 0 0 40px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Illustration -->
        <div class="flex-1 flex items-center justify-center px-8 pt-8 pb-4">
            <img src="assets/push_bell.png" alt="Notification Bell" class="w-full max-w-[200px] object-contain drop-shadow-xl">
        </div>

        <!-- Bottom Sheet -->
        <div class="bg-white rounded-t-[40px] pt-8 pb-6 px-8 shadow-[0_-10px_40px_rgba(0,0,0,0.04)] relative z-10 flex flex-col items-center">
            
            <!-- Text Content -->
            <div class="text-center mb-6 w-full">
                <h1 class="text-[28px] font-extrabold text-[#111827] leading-tight tracking-tight mb-3">
                    Stay on Track
                </h1>
                <p class="text-[14.5px] text-[#6B7280] leading-relaxed font-medium px-1">
                    Get reminders to log your pressure twice a day for better accuracy.
                </p>
            </div>

            <!-- Cards -->
            <div class="flex flex-col gap-3 mb-8 w-full max-w-[320px]">
                <div class="bg-[#F4F7FA] rounded-2xl p-3.5 flex justify-between items-center border border-gray-100/50 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-white shadow-sm rounded-full flex items-center justify-center text-[#43A047]">
                            <span class="material-icons text-[20px]">wb_sunny</span>
                        </div>
                        <div class="text-left">
                            <div class="font-bold text-[14px] text-[#111827]">Morning</div>
                            <div class="text-[12px] text-[#6B7280] font-medium">9:00 AM</div>
                        </div>
                    </div>
                    <div class="w-12 h-6 bg-[#43A047] rounded-full relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]">
                        <div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-[0_2px_4px_rgba(0,0,0,0.2)]"></div>
                    </div>
                </div>

                <div class="bg-[#F4F7FA] rounded-2xl p-3.5 flex justify-between items-center border border-gray-100/50 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-white shadow-sm rounded-full flex items-center justify-center text-[#43A047]">
                            <span class="material-icons text-[20px]">bedtime</span>
                        </div>
                        <div class="text-left">
                            <div class="font-bold text-[14px] text-[#111827]">Evening</div>
                            <div class="text-[12px] text-[#6B7280] font-medium">8:00 PM</div>
                        </div>
                    </div>
                    <div class="w-12 h-6 bg-[#43A047] rounded-full relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]">
                        <div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-[0_2px_4px_rgba(0,0,0,0.2)]"></div>
                    </div>
                </div>
            </div>

            <!-- The Button -->
            <button class="w-full max-w-[320px] mx-auto bg-gradient-to-r from-[#74D680] to-[#43A047] text-white rounded-full py-[18px] flex items-center justify-center gap-2 shadow-[0_8px_25px_rgba(74,169,129,0.35)] active:scale-95 transition-transform mb-4">
                <span class="font-[800] text-[18px] leading-none py-1">Enable Notifications</span>
            </button>
            
            <!-- Maybe Later -->
            <div class="flex justify-center mb-1">
                <button class="text-[#2b64c0] font-bold text-[13px] hover:text-[#1956B3] transition-colors">Maybe Later</button>
            </div>
            
            <!-- Home Indicator Mock -->
            <div class="mt-4 mb-2 w-[120px] h-1 bg-black/80 rounded-full"></div>
        </div>
    </div>
</body>
</html>
