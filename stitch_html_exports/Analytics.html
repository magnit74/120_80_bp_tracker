<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Trends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; }
        .app-container { max-width: 400px; margin: 0 auto; background: #F4F7FA; min-height: 100vh; position: relative; padding-bottom: 100px; box-shadow: 0 0 40px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="app-container flex flex-col pt-4">
        <!-- Top Period Selector (Toggle) -->
        <div class="px-10 mb-6 mt-4">
            <div class="flex bg-white rounded-full p-1 shadow-[0_4px_15px_rgba(0,0,0,0.03)] border border-gray-100 text-[13px] font-bold relative">
                <button class="flex-1 py-1.5 text-gray-500 bg-transparent relative z-10">Week</button>
                <div class="absolute left-1/3 w-1/3 h-[calc(100%-8px)] bg-[#2b64c0] rounded-full top-1 shadow-sm transition-all z-0"></div>
                <button class="flex-1 py-1.5 text-white bg-transparent relative z-10">Month</button>
                <button class="flex-1 py-1.5 text-gray-500 bg-transparent relative z-10">Year</button>
            </div>
        </div>

        <!-- Main Chart Card -->
        <div class="px-5 mb-5">
            <div class="bg-white rounded-[24px] shadow-[0_12px_35px_rgba(0,0,0,0.04)] border border-gray-100 p-5 h-[250px] relative">
                <!-- Y Axis Labels -->
                <div class="absolute left-4 top-5 bottom-8 flex flex-col justify-between text-[10px] text-gray-400 font-bold h-[160px]">
                    <span>140</span>
                    <span>120</span>
                    <span>100</span>
                    <span>80</span>
                    <span>60</span>
                </div>
                
                <!-- Grid Lines -->
                <div class="absolute left-12 right-5 top-5 h-[160px] flex flex-col justify-between">
                    <div class="border-b border-gray-100 w-full flex-1"></div>
                    <div class="border-b border-gray-100 w-full flex-1"></div>
                    <div class="border-b border-gray-100 w-full flex-1"></div>
                    <div class="border-b border-gray-100 w-full flex-1"></div>
                </div>

                <!-- Chart Graphic SVG -->
                <div class="absolute left-12 right-5 top-5 h-[160px]">
                    <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <!-- Top Red Line -->
                        <path d="M0,25 L10,22 L20,24 L30,28 L40,25 L50,18 L60,26 L70,22 L80,28 L90,20 L100,26" stroke="#D32F2F" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
                        <!-- Bottom Red Line -->
                        <path d="M0,75 L10,72 L20,74 L30,78 L40,75 L50,68 L60,76 L70,72 L80,78 L90,70 L100,76" stroke="#D32F2F" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
                        <!-- Red Gradient Fill between lines (simplified as under top line) -->
                        <path d="M0,25 L10,22 L20,24 L30,28 L40,25 L50,18 L60,26 L70,22 L80,28 L90,20 L100,26 L100,100 L0,100 Z" fill="url(#redGrad)" opacity="0.12"/>
                        <defs>
                            <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#D32F2F"/>
                                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <!-- X Axis Labels -->
                <div class="absolute bottom-4 left-12 right-5 flex justify-between text-[10px] font-bold text-gray-400">
                    <span>1 Oct</span>
                    <span>8 Oct</span>
                    <span>15 Oct</span>
                    <span>22 Oct</span>
                </div>
            </div>
        </div>

        <!-- Averages Cards -->
        <div class="px-5 flex gap-4 mb-6">
            <!-- Avg BP -->
            <div class="flex-1 bg-white rounded-[20px] p-4 shadow-[0_8px_30px_rgba(0,0,0,0.03)] border border-gray-100">
                <div class="flex items-center gap-1.5 mb-2">
                    <div class="w-7 h-7 rounded-[8px] bg-[#FDF2F2] flex items-center justify-center text-[#CC202C]">
                        <span class="material-icons text-[16px]">favorite_border</span>
                    </div>
                    <span class="text-[12px] font-bold text-gray-500">Average BP</span>
                </div>
                <div class="flex items-baseline gap-1 mt-3">
                    <span class="text-[28px] font-[900] text-[#1E293B] tracking-tighter">117/78</span>
                    <span class="material-icons text-gray-400 text-[18px]">arrow_right_alt</span>
                </div>
            </div>
            
            <!-- Avg Pulse -->
            <div class="flex-1 bg-white rounded-[20px] p-4 shadow-[0_8px_30px_rgba(0,0,0,0.03)] border border-gray-100">
                <div class="flex items-center gap-1.5 mb-2">
                    <div class="w-7 h-7 rounded-[8px] bg-[#F0F5FA] flex items-center justify-center text-[#2b64c0]">
                        <span class="material-icons text-[16px]">show_chart</span>
                    </div>
                    <span class="text-[12px] font-bold text-gray-500">Average Pulse</span>
                </div>
                <div class="flex items-baseline gap-1 mt-3">
                    <span class="text-[28px] font-[900] text-[#1E293B] tracking-tighter">72</span>
                    <span class="text-gray-800 font-bold text-[13px]">bpm</span>
                    <span class="material-icons text-[#2b64c0] text-[18px] ml-auto">trending_up</span>
                </div>
            </div>
        </div>

        <!-- Status Bars -->
        <div class="px-5 mb-5">
            <div class="flex justify-between text-[11px] font-bold mb-1">
                <span class="text-gray-800">Normal</span>
                <span class="text-gray-800">Elevated</span>
                <span class="text-gray-800">High</span>
            </div>
            <div class="flex h-2.5 rounded-full overflow-hidden mb-1 gap-0.5">
                <div class="bg-[#4AA981] w-[65%]"></div>
                <div class="bg-[#F5A623] w-[25%]"></div>
                <div class="bg-[#CC202C] w-[10%]"></div>
            </div>
            <div class="flex justify-between text-[11px] font-bold text-gray-600">
                <span>65%</span>
                <span>25%</span>
                <span>10%</span>
            </div>
        </div>

        <!-- Export Button -->
        <div class="px-5 mb-32 relative z-0">
            <button class="w-full max-w-[320px] mx-auto bg-gradient-to-r from-[#6bd173] to-[#43a047] text-white rounded-[24px] py-[18px] flex items-center justify-center gap-2 shadow-[0_8px_25px_rgba(67,160,71,0.35)] active:scale-95 transition-transform">
                <span class="material-icons text-[22px]">description</span>
                <span class="font-[800] text-[18px] leading-none py-1">Export PDF</span>
            </button>
        </div>

        <!-- Fixed Bottom Section (Tab Bar) -->
        <!-- Using drop-shadow on the wrapper creates a unified shadow for the bar AND the circular bump -->
        <div class="fixed bottom-0 w-full max-w-[400px] z-10 left-1/2 -translate-x-1/2 flex flex-col" style="filter: drop-shadow(0px -4px 20px rgba(0,0,0,0.06));">
            
            <!-- Tab Bar -->
            <div class="bg-white h-[85px] w-full flex justify-between px-10 relative z-10 rounded-t-[24px]">
                
                <!-- Home -->
                <div class="flex flex-col items-center justify-center h-full pb-2 ml-4">
                    <span class="material-icons text-gray-500 text-[28px] mb-1">home</span>
                    <span class="text-gray-500 text-[12px] font-medium leading-none">Home</span>
                </div>
                
                <!-- Analytics -->
                <div class="flex flex-col items-center justify-center h-full pb-2 mr-4">
                    <span class="material-icons text-[#2b64c0] text-[28px] mb-1">bar_chart</span>
                    <span class="text-[#2b64c0] text-[12px] font-medium leading-none">Analytics</span>
                </div>

                <!-- Giant Center Plus Button (The Cutout) -->
                <div class="absolute -top-[28px] left-1/2 -translate-x-1/2 bg-white rounded-full p-[8px]">
                    <div class="w-[56px] h-[56px] bg-[#D32F2F] rounded-full flex items-center justify-center shadow-[0_8px_16px_rgba(211,47,47,0.4)] active:scale-95 transition-transform cursor-pointer">
                        <span class="material-icons text-white text-[32px]">add</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
