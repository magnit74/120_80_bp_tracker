<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating Modal Prototype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Phone frame simulation */
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #ffffff;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Mock background for context (Home Dashboard blur) */
        .mock-background {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 100%);
            filter: blur(4px);
            z-index: 1;
        }

        /* Overlay */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* Modal Card */
        .modal-card {
            background: #ffffff;
            width: 100%;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0,0,0,0.15);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Icon/Illustration */
        .icon-container {
            width: 64px;
            height: 64px;
            background: #FFF3E0;
            border-radius: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        .icon-container svg {
            width: 32px;
            height: 32px;
            fill: #F59E0B;
        }

        /* Text */
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #6B7280;
            margin: 0 0 32px;
            line-height: 1.4;
        }

        /* Stars */
        .stars-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .star {
            width: 44px;
            height: 44px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .star svg {
            width: 100%;
            height: 100%;
            fill: #E5E7EB;
            transition: fill 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .star:hover svg {
            transform: scale(1.1);
        }

        .star.active svg {
            fill: #F59E0B;
            filter: drop-shadow(0 4px 6px rgba(245, 158, 11, 0.3));
        }

        /* Dynamic Feedback Text */
        .feedback-text {
            font-size: 16px;
            font-weight: 600;
            color: #F59E0B;
            height: 24px;
            margin-bottom: 32px;
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.3s ease;
        }
        
        .feedback-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Action Buttons */
        .submit-btn {
            background: #E5E7EB;
            color: #9CA3AF;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .submit-btn.active {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.25);
        }

        .submit-btn.active:active {
            transform: scale(0.98);
        }

        .close-btn {
            background: transparent;
            color: #6B7280;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="mock-background"></div>
        
        <div class="modal-overlay">
            <div class="modal-card">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                
                <h2 class="title">Вам нравится 120/80 BP Tracker?</h2>
                <p class="subtitle">Ваша оценка помогает нам становиться лучше с каждым днем.</p>

                <div class="stars-container" id="stars">
                    <!-- 5 Stars -->
                    <div class="star" data-value="1">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </div>
                    <div class="star" data-value="2">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </div>
                    <div class="star" data-value="3">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </div>
                    <div class="star" data-value="4">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </div>
                    <div class="star" data-value="5">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </div>
                </div>

                <div class="feedback-text" id="feedback-text"></div>

                <button class="submit-btn" id="submit-btn" disabled>Оценить</button>
                <button class="close-btn">Не сейчас</button>
            </div>
        </div>
    </div>

    <script>
        const stars = document.querySelectorAll('.star');
        const submitBtn = document.getElementById('submit-btn');
        const feedbackText = document.getElementById('feedback-text');
        
        let currentRating = 0;

        const getFeedbackMessage = (rating) => {
            if (rating <= 2) return "Нам жаль, мы хотим стать лучше 😔";
            if (rating === 3) return "Спасибо! Мы учтем это 🤔";
            if (rating === 4) return "Хорошо! Рады стараться 😊";
            if (rating === 5) return "Идеально! Спасибо огромное 😍";
            return "";
        };

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const value = parseInt(star.dataset.value);
                currentRating = value;
                
                // Light up stars
                stars.forEach((s, index) => {
                    if (index < value) {
                        s.classList.add('active');
                        // Add pop animation
                        s.style.transform = 'scale(1.2)';
                        setTimeout(() => s.style.transform = '', 200);
                    } else {
                        s.classList.remove('active');
                    }
                });

                // Update text
                feedbackText.textContent = getFeedbackMessage(value);
                feedbackText.classList.add('visible');

                // Enable button
                submitBtn.classList.add('active');
                submitBtn.removeAttribute('disabled');
            });
        });

        submitBtn.addEventListener('click', () => {
            if (currentRating > 0) {
                alert(currentRating <= 3 ? "Симулируем отправку в Firebase..." : "Симулируем открытие окна App Store/Google Play...");
            }
        });
    </script>
</body>
</html>
