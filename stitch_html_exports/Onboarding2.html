<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; }
        .app-container { max-width: 400px; margin: 0 auto; background: radial-gradient(circle at top, #ffffff 0%, #F4F7FA 100%); min-height: 100vh; position: relative; padding-bottom: 0; box-shadow: 0 0 40px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Illustration -->
        <div class="flex-1 flex items-center justify-center px-8 pt-12 pb-8">
            <img src="assets/onboarding_2_phone.png" alt="Phone showing BP" class="w-full max-w-[280px] object-contain drop-shadow-xl">
        </div>

        <!-- Bottom Sheet (Text + Button) -->
        <div class="bg-white rounded-t-[40px] pt-10 pb-6 px-8 shadow-[0_-10px_40px_rgba(0,0,0,0.04)] relative z-10 flex flex-col items-center">
            
            <!-- Text Content -->
            <div class="text-center mb-8 w-full">
                <h1 class="text-[28px] font-extrabold text-[#111827] leading-tight tracking-tight mb-4">
                    Log Readings in Seconds
                </h1>
                <p class="text-[15px] text-[#6B7280] leading-relaxed font-medium px-2">
                    Quick, effortless entry for busy lives so you can focus on what matters most.
                </p>
            </div>

            <!-- The Button -->
            <button class="w-full max-w-[320px] mx-auto bg-gradient-to-r from-[#74D680] to-[#43A047] text-white rounded-full py-[18px] flex items-center justify-center gap-2 shadow-[0_8px_25px_rgba(74,169,129,0.35)] active:scale-95 transition-transform">
                <span class="font-[800] text-[18px] leading-none py-1">Continue</span>
            </button>
            
            <!-- Pagination & Skip -->
            <div class="mt-6 flex items-center justify-between w-full max-w-[320px] relative">
                <button class="text-gray-400 font-bold text-[13px] hover:text-gray-600 transition-colors">Skip</button>
                <div class="flex gap-1.5 absolute left-1/2 -translate-x-1/2">
                    <div class="w-1.5 h-1.5 rounded-full bg-gray-200"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-[#E15858]"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-gray-200"></div>
                </div>
                <div class="w-8"></div> <!-- Spacer to balance "Skip" -->
            </div>
            
            <!-- Home Indicator Mock -->
            <div class="mt-5 mb-2 w-[120px] h-1 bg-black/80 rounded-full"></div>
        </div>
    </div>
</body>
</html>
