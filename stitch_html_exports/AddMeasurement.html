<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Measurement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; }
        .app-container { max-width: 400px; margin: 0 auto; background: #F4F7FA; min-height: 100vh; position: relative; padding-bottom: 120px; box-shadow: 0 0 40px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="app-container flex flex-col pt-2">
        <!-- Top Navigation Bar -->
        <div class="flex items-center justify-between px-4 pb-4">
            <button class="flex items-center text-[#CC202C] font-semibold text-[15px]">
                <span class="material-icons text-[22px]">chevron_left</span> Back
            </button>
            <div class="font-[800] text-[16px] text-[#111827]">Add Measurement</div>
            <button class="text-[#CC202C] font-semibold text-[15px]">Cancel</button>
        </div>

        <!-- Dials Card -->
        <div class="px-5 mt-2 mb-6">
            <div class="bg-white rounded-[32px] pt-8 pb-4 px-6 shadow-[0_12px_40px_rgba(0,0,0,0.04)] border border-gray-100 flex flex-col justify-center relative">
                
                <!-- Systolic -->
                <div class="flex flex-col items-center mb-8 relative z-10">
                    <div class="flex items-center justify-center gap-6 w-full">
                        <button class="w-12 h-12 bg-white border border-[#CC202C]/20 rounded-full flex items-center justify-center shadow-sm active:scale-95 text-[#CC202C] hover:bg-[#FDF2F2] transition-colors">
                            <span class="material-icons text-[28px]">remove</span>
                        </button>
                        
                        <div class="w-28 h-28 bg-gradient-to-br from-[#E44B55] to-[#CC202C] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(204,32,44,0.3)] text-white">
                            <span class="text-[54px] font-[900] tracking-tighter leading-none mt-2">120</span>
                        </div>

                        <button class="w-12 h-12 bg-white border border-[#CC202C]/20 rounded-full flex items-center justify-center shadow-sm active:scale-95 text-[#CC202C] hover:bg-[#FDF2F2] transition-colors">
                            <span class="material-icons text-[28px]">add</span>
                        </button>
                    </div>
                    <div class="text-[#6B7280] font-semibold text-[13px] mt-3 tracking-wide uppercase">Systolic (mmHg)</div>
                </div>

                <!-- Diastolic -->
                <div class="flex flex-col items-center mb-8 relative z-10">
                    <div class="flex items-center justify-center gap-6 w-full">
                        <button class="w-12 h-12 bg-white border border-[#CC202C]/20 rounded-full flex items-center justify-center shadow-sm active:scale-95 text-[#CC202C] hover:bg-[#FDF2F2] transition-colors">
                            <span class="material-icons text-[28px]">remove</span>
                        </button>
                        
                        <div class="w-28 h-28 bg-gradient-to-br from-[#E44B55] to-[#CC202C] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(204,32,44,0.3)] text-white">
                            <span class="text-[54px] font-[900] tracking-tighter leading-none mt-2">80</span>
                        </div>

                        <button class="w-12 h-12 bg-white border border-[#CC202C]/20 rounded-full flex items-center justify-center shadow-sm active:scale-95 text-[#CC202C] hover:bg-[#FDF2F2] transition-colors">
                            <span class="material-icons text-[28px]">add</span>
                        </button>
                    </div>
                    <div class="text-[#6B7280] font-semibold text-[13px] mt-3 tracking-wide uppercase">Diastolic (mmHg)</div>
                </div>
                
                <!-- Pulse -->
                <div class="flex flex-col items-center mb-4 relative z-10">
                    <div class="flex items-center justify-center gap-6 w-full">
                        <button class="w-12 h-12 bg-white border border-[#1956B3]/20 rounded-full flex items-center justify-center shadow-sm active:scale-95 text-[#1956B3] hover:bg-[#F0F5FA] transition-colors">
                            <span class="material-icons text-[28px]">remove</span>
                        </button>
                        
                        <div class="w-28 h-28 bg-gradient-to-br from-[#2B75E6] to-[#1956B3] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(25,86,179,0.25)] text-white">
                            <span class="text-[54px] font-[900] tracking-tighter leading-none mt-2">60</span>
                        </div>

                        <button class="w-12 h-12 bg-white border border-[#1956B3]/20 rounded-full flex items-center justify-center shadow-sm active:scale-95 text-[#1956B3] hover:bg-[#F0F5FA] transition-colors">
                            <span class="material-icons text-[28px]">add</span>
                        </button>
                    </div>
                    <div class="text-[#6B7280] font-semibold text-[13px] mt-3 tracking-wide uppercase">Pulse (bpm)</div>
                </div>
            </div>
        </div>

        <!-- Quick Tags Card -->
        <div class="px-5 mb-8">
            <div class="bg-white rounded-[24px] p-5 shadow-[0_8px_30px_rgba(0,0,0,0.03)] border border-gray-100">
                <h3 class="text-[14px] font-[800] text-[#111827] mb-3">Quick Tags</h3>
                <div class="flex flex-wrap gap-2">
                    <div class="px-3 py-1.5 rounded-full bg-[#FDF2F2] border border-[#FDF2F2] text-[#CC202C] font-bold text-[12px] shadow-sm">Morning</div>
                    <div class="px-3 py-1.5 rounded-full border border-gray-200 text-gray-500 font-bold text-[12px] shadow-sm bg-white">Evening</div>
                    <div class="px-3 py-1.5 rounded-full bg-[#FDF2F2] border border-[#FDF2F2] text-[#CC202C] font-bold text-[12px] shadow-sm">Headache</div>
                    <div class="px-3 py-1.5 rounded-full border border-gray-200 text-gray-500 font-bold text-[12px] shadow-sm bg-white">Before Meds</div>
                    <div class="px-3 py-1.5 rounded-full border border-gray-200 text-gray-500 font-bold text-[12px] shadow-sm bg-white">Stress</div>
                </div>
            </div>
        </div>

        <!-- Fixed Bottom Section -->
        <div class="fixed bottom-0 w-full max-w-[400px] bg-white/90 backdrop-blur-md pb-8 pt-4 px-5 z-20 left-1/2 -translate-x-1/2 border-t border-gray-100/50">
            <button class="w-full max-w-[320px] mx-auto bg-gradient-to-r from-[#E44B55] to-[#CC202C] text-white rounded-full py-[18px] flex items-center justify-center gap-2 shadow-[0_8px_25px_rgba(204,32,44,0.35)] active:scale-95 transition-transform">
                <span class="font-[800] text-[18px] leading-none py-1">Save Measurement</span>
            </button>
        </div>
    </div>
</body>
</html>
